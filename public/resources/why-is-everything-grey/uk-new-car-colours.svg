<text x="38" y="228.1" font-size="13" fill="#56666E" text-anchor="end">40%</text>
<line x1="44" x2="388" y1="179.4" y2="179.4" stroke="#D9E1E4" stroke-width="1"/>
<text x="38" y="184.4" font-size="13" fill="#56666E" text-anchor="end">50%</text>
<line x1="44" x2="388" y1="135.7" y2="135.7" stroke="#D9E1E4" stroke-width="1"/>
<text x="38" y="140.7" font-size="13" fill="#56666E" text-anchor="end">60%</text>
<line x1="44" x2="388" y1="92.0" y2="92.0" stroke="#D9E1E4" stroke-width="1"/>
<text x="38" y="97.0" font-size="13" fill="#56666E" text-anchor="end">70%</text>
