<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" role="img" aria-labelledby="t d" font-family="Albert Sans, Arial, Helvetica, sans-serif">
<title id="t">Share of new UK cars in grey, and in grey, black or white, 2014 to 2025</title>
<desc id="d">Grey rose from 14% of new cars in 2014 to 27.6% in 2025. Grey, black and white together rose from about 55% to 63.7%.</desc>
<rect width="480" height="470" fill="#FFFFFF"/>
<text x="16" y="30" font-size="19" font-weight="700" fill="#0F2A36">Grey has almost doubled its share</text>
<text x="16" y="54" font-size="19" font-weight="700" fill="#0F2A36">of new UK cars since 2014</text>
<text x="16" y="76" font-size="14" fill="#56666E">Share of new car registrations, UK</text>
